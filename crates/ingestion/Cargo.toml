[package]
name = "ingestion"
version = "0.1.0"
edition = "2024"

[lib]
name = "ingestion"
path = "src/lib.rs"

[[bin]]
name = "ingestion"
path = "src/main.rs"

[dependencies]
trampantojo-core = { path = "../core" }
storage = { path = "../storage" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"] }
dotenvy = "0.15"

# Dependencias que solo necesita lib.rs (el pipeline):
# uuid, chrono — usados en lib.rs para construir Ioc
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
