[package]
name = "whatsapp-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web server
axum          = { version = "0.7", features = ["macros"] }
tokio         = { version = "1",   features = ["full"] }
tower-http    = { version = "0.5", features = ["trace"] }

# Serialización / deserialización de payloads de Meta & Twilio
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

# HMAC-SHA256 para validar la firma X-Hub-Signature-256 de Meta
hmac          = "0.12"
sha2          = "0.10"
hex           = "0.4"
constant_time_eq = "0.3"

# Variables de entorno + observabilidad
dotenvy       = "0.15"
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow        = "1.0"
